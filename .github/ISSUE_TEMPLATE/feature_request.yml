name: "✨ Feature Request"
description: "Suggest a new feature, module, or enhancement for WAEX"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please ensure this feature aligns with the project goals and has not already been requested.
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and discussions to verify this feature hasn't been proposed yet.
          required: true
        - label: I have clearly explained the use-case and why this belongs in WAEX.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or missing functionality?
      placeholder: "A clear description of what the problem/limitation is. (e.g. I am always frustrated when...)"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature Description
      description: Describe the feature, user interface changes, or hooks you'd like to see added.
      placeholder: "A clear description of what you want to happen..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, third-party apps, or workarounds you've considered.
      placeholder: "Alternative approaches or reasons why existing workarounds are insufficient..."
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or implementation ideas.
