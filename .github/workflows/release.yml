name: Release

# Pushing to main (stable), beta (beta) or nightly (nightly) releases that channel when the
# final commit message contains the word --release. The channel is taken from the branch,
# the version is bumped from gradle.properties and the repository tags, and gradle.properties
# is committed back so it always matches the last release.
#
# nightly also releases without the flag when the push is a PR that the nightly PR gate
# approved (label ai-approved) and the merge app squash-merged; see docs/NIGHTLY_CONTRIBUTOR_RULES.md.
#
# Branch rules: protect-main and protect-beta block every push except from bypass actors, and
# protect-nightly additionally requires pull requests. The version-bump commit is therefore pushed
# with RELEASE_PUSH_TOKEN (a bypass user) when set, otherwise with a WAEX app installation token
# (bypass actor on nightly; add the app to protect-main and protect-beta bypass lists too).
on:
  push:
    branches: [main, beta, nightly]

permissions: {}

# One release at a time so version bumps and tags never race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Detect release request
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.flags.outputs.should_release }}
      channel: ${{ steps.flags.outputs.channel }}
    steps:
      - name: Match --release flag and branch
        id: flags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BRANCH" in
            main) channel=stable ;;
            beta) channel=beta ;;
            nightly) channel=nightly ;;
            *) channel="" ;;
          esac
          should=false
          if [ -n "$channel" ] && [[ "$COMMIT_MSG" =~ (^|[[:space:]])--release([[:space:]]|$) ]]; then
            should=true
          fi
          # A PR that passed the nightly gate and review is merged by the merge app and released
          # without needing the flag. Humans still use --release.
          if [ "$should" = false ] && [ "$channel" = nightly ]; then
            number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "first(.[] | select(.merged_at != null and .base.ref == \"nightly\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number) // empty" || true)"
            if [[ "$number" =~ ^[0-9]+$ ]]; then
              pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
                --jq '[.merged_by.type, ([.labels[].name] | index("ai-approved") != null), ([.labels[].name] | index("needs-maintainer") == null)] | @tsv' || true)"
              if [ "$pr" = "$(printf 'Bot\ttrue\ttrue')" ]; then
                echo "PR #$number was approved by the nightly gate and merged by the merge app"
                should=true
              fi
            fi
          fi
          echo "should_release=$should" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish ${{ needs.gate.outputs.channel }}
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      CHANNEL: ${{ needs.gate.outputs.channel }}
      XPOSED_REPO_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
      PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
    steps:
      # The branch rules only let bypass actors push, so the bump commit needs a real identity.
      - name: Create push token for the merge app
        id: app-token
        if: env.PUSH_TOKEN == ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WAEX_APP_ID }}
          private-key: ${{ secrets.WAEX_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || steps.app-token.outputs.token || github.token }}

      # :licensing is a private module that is not tracked in this repository.
      - name: Check out private licensing module
        uses: actions/checkout@v4
        with:
          repository: mubashardev/waex-licensing
          token: ${{ secrets.LICENSING_REPO_TOKEN }}
          path: licensing
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Calculate next version and update gradle.properties
        id: version
        run: |
          python3 scripts/release/next_version.py --channel "$CHANNEL" --sha "$GITHUB_SHA" --write >> "$GITHUB_OUTPUT"
          name="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2- | tr -d '\r\n')"
          code="$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2- | tr -d '\r\n')"
          clean="${name%%+*}"
          echo "clean_name=$clean" >> "$GITHUB_OUTPUT"
          echo "tag=${clean}" >> "$GITHUB_OUTPUT"
          echo "Releasing $name ($code) on $CHANNEL"

      - name: Prepare release notes
        run: |
          cp changelog.txt notes.txt
          if [ ! -s notes.txt ]; then echo "No user-visible changes were recorded." > notes.txt; fi
          if [ "$CHANNEL" = nightly ]; then
            printf '\nBuilt from commit %s\n' "$GITHUB_SHA" >> notes.txt
          fi

      - name: Build APKs
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEY_STORE" ]; then
            echo "$KEY_STORE" | base64 --decode > release.jks
          fi
          ./gradlew assembleRelease assembleDebug \
            -PandroidStoreFile=release.jks \
            -PandroidStorePassword="$KEY_STORE_PASSWORD" \
            -PandroidKeyAlias="$ALIAS" \
            -PandroidKeyPassword="$KEY_PASSWORD"
          rm -f release.jks

      - name: Collect APKs
        env:
          NAME: ${{ steps.version.outputs.clean_name }}
        run: |
          mkdir -p release_artifacts
          cp "app/build/outputs/apk/release/WaEnhancerX-v${NAME}_release.apk" release_artifacts/
          cp "app/build/outputs/apk/debug/WaEnhancerX-v${NAME}_debug.apk" release_artifacts/
          ls -l release_artifacts

      - name: Commit version bump
        id: bump
        env:
          NAME: ${{ steps.version.outputs.version_name }}
          CODE: ${{ steps.version.outputs.version_code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          # The first release of a base version already matches gradle.properties.
          if git diff --cached --quiet; then
            echo "gradle.properties already matches ${NAME} (${CODE}); nothing to commit."
          else
            git commit -m "chore(release): ${CHANNEL} ${NAME} (${CODE}) [skip ci]"
            # Other PRs may have landed while this build ran; only gradle.properties changes here,
            # so rebasing the bump commit is safe.
            for attempt in 1 2 3; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              [ "$attempt" = 3 ] && { echo "::error::Could not push the version bump to ${GITHUB_REF_NAME}. Check the branch rules allow the push token."; exit 1; }
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.bump.outputs.sha }}
          name: WaEnhancerX v${{ steps.version.outputs.clean_name }}
          body_path: notes.txt
          prerelease: ${{ env.CHANNEL != 'stable' }}
          files: |
            release_artifacts/WaEnhancerX-v${{ steps.version.outputs.clean_name }}_release.apk
            release_artifacts/WaEnhancerX-v${{ steps.version.outputs.clean_name }}_debug.apk

      # Stable and beta are also published to the module repository; nightly never is.
      - name: Publish to Xposed module repository
        if: env.CHANNEL != 'nightly' && env.XPOSED_REPO_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/com.waenhancer
          token: ${{ secrets.XPOSED_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: WaEnhancerX v${{ steps.version.outputs.clean_name }}
          body_path: notes.txt
          prerelease: ${{ env.CHANNEL != 'stable' }}
          files: |
            release_artifacts/WaEnhancerX-v${{ steps.version.outputs.clean_name }}_release.apk
            release_artifacts/WaEnhancerX-v${{ steps.version.outputs.clean_name }}_debug.apk

      - name: Refresh release index
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-index.yml --repo "$GITHUB_REPOSITORY"

      # Releases created with the workflow token never emit a `released` event, so the
      # VirusTotal workflow would not run on its own. Dispatch it for every channel
      # (stable, beta and nightly).
      - name: Start VirusTotal scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run virustotal-scan.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
