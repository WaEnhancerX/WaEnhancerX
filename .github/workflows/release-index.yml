name: Update release index

# Keeps the per-channel index files on the release-index branch in sync with published releases.
# Release events cover this repository; the schedule also picks up releases published in the
# module repository (Xposed-Modules-Repo/com.waenhancer), which cannot trigger workflows here.
on:
  release:
    types: [published, edited, deleted, released, prereleased]
  # A pull request merged into nightly brings a changelog fragment, and a Nightly release clears them;
  # either way the pending nightly changelog on the index branch has to follow.
  push:
    branches: [nightly]
    paths: ['changelog.d/**']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-index
  cancel-in-progress: false

jobs:
  update:
    name: Rebuild release-index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the generator from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: src
          persist-credentials: false
          sparse-checkout: |
            scripts/release/build_release_index.py
            scripts/release/build_pending_changelog.py
            scripts/release/assemble-notes.py
          sparse-checkout-cone-mode: false

      - name: Check out the release-index branch
        uses: actions/checkout@v4
        with:
          ref: release-index
          path: index

      - name: Rebuild index files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 src/scripts/release/build_release_index.py index

      # The changelog the next Nightly will have: every fragment merged into nightly since the last
      # release, merged section by section. A problem here must not stop the release channels above.
      - name: Check out the nightly changelog fragments
        uses: actions/checkout@v4
        with:
          ref: nightly
          path: nightly-src
          persist-credentials: false
          sparse-checkout: changelog.d
          sparse-checkout-cone-mode: false

      - name: Build the pending nightly changelog
        continue-on-error: true
        run: python3 src/scripts/release/build_pending_changelog.py nightly-src/changelog.d index

      - name: Commit and push when changed
        working-directory: index
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update release index"
          git push origin HEAD:release-index
