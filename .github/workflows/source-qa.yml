name: Source and JVM regression checks

on:
  push:
    branches: [main, 'integration/preview-current-main-*', 'fix/qa-localized-catalog-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-jvm:
    name: JDK 21 / Python 3.11 / Kotlin syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public source without private submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require complete source parsing tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          if ! command -v kotlinc >/dev/null 2>&1; then
            echo '::error::Kotlin CLI/compiler missing; syntax checks cannot silently pass.'
            exit 1
          fi
          kotlinc -version

      - name: Verify bounded Maven dependency recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_maven_dependencies.py --out "$RUNNER_TEMP/waex-maven-recovery"

      - name: Upload Maven dependency recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-dependency-recovery-evidence
          path: |
            ${{ runner.temp }}/waex-maven-recovery/result.json
            ${{ runner.temp }}/waex-maven-recovery/test_*/*.log
            ${{ runner.temp }}/waex-maven-recovery/test_*/*retry.json
            ${{ runner.temp }}/waex-maven-recovery/test_*/calls.jsonl
            ${{ runner.temp }}/waex-maven-recovery/test_*/config.json
          retention-days: 14
          if-no-files-found: error

      - name: Parse all production Java and Kotlin files (no Android SDK)
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/check_syntax.py --root app/src/main/java

      - name: Test the fail-closed syntax checker itself
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_syntax_checker.py

      - name: Run required public-source JVM regression suites
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            qa/test_provider_scope.py
            qa/test_preference_write_types.py
            qa/test_bridge_contract.py
            qa/test_bridge_ordering.py
            qa/test_media_preference_sync.py
            qa/test_dnd_preference_policy.py
            qa/test_dex_negative_cache.py
            qa/test_android24_compatibility.py
            qa/test_restart_safety.py
            qa/test_hook_return_types.py
            qa/test_monet_wiring.py
            qa/test_catalog_source.py
            qa/test_catalog_apk.py
            qa/test_catalog_resource_keep.py
            qa/test_edit_history_identity.py
            qa/test_edit_history_adapter_binding.py
            qa/test_edit_history_diff_budget.py
          )
          for test_script in "${tests[@]}"; do
            echo "::group::$test_script"
            python3 "$test_script"
            echo '::endgroup::'
          done

      - name: Verify public Spanish Latin America resources and runtime lookup
        shell: bash
        run: |
          set -euo pipefail
          test -f qa/localization_support.py
          test -f qa/test_es419_localization.py
          test -f qa/test_es419_runtime.py
          python3 qa/test_es419_localization.py
          python3 qa/test_es419_runtime.py

      - name: Verify exact and alternate call-ending event contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/test_call_recording_event_contract.py --out "$RUNNER_TEMP/call-ending-contract-qa"
          python3 qa/test_call_recording_lifecycle.py --host-variant typed-ending --out "$RUNNER_TEMP/call-recording-typed-qa"

      - name: Upload call-ending contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-ending-contract-evidence
          path: |
            ${{ runner.temp }}/call-ending-contract-qa/result.json
            ${{ runner.temp }}/call-ending-contract-qa/**/compile*.log
            ${{ runner.temp }}/call-ending-contract-qa/**/behavior.log
            ${{ runner.temp }}/call-recording-typed-qa/source-identity.json
            ${{ runner.temp }}/call-recording-typed-qa/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Require tests for merged runtime and resource contracts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/src/main/java/com/waenhancer/utils/DeclaredWhatsAppTargets.java ]]; then
            test -f qa/test_declared_targets.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/utils/InjectionEvidence.kt ]]; then
            test -f qa/test_runtime_diagnostics.py
            test -f qa/fixtures/RuntimeDiagnosticsChecks.kt
          fi
          store=app/src/main/java/com/waenhancer/xposed/features/automation/PresenceStateStore.java
          ui=app/src/main/java/com/waenhancer/ui/screens/settings/StylesSettingsScreen.kt
          if grep -q 'updateAndGetTransition(' "$store"; then
            test -f qa/test_presence_invalidation.py
            test -f qa/test_presence_state_invalidation.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/automation/PresenceToastsHook.java ]]; then
            test -f qa/test_receipt_observation.py
            test -f qa/fixtures/receipt_observation/ReceiptObservationFixture.java.in
          fi
          if grep -q 'putPublicString("seentick", nextPlacement)' "$ui"; then
            test -f qa/test_manual_seen_tick_persistence.py
          fi
          if [[ -f app/src/main/res/raw/waex_dynamic_menu_icons_keep.xml ]]; then
            test -f qa/test_dynamic_menu_resources.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/privacy/StatusHookContract.java ]]; then
            test -f qa/test_status_hook_contract.py
            test -f qa/java/TestStatusHookContract.java
            test -f qa/fixtures/StatusHookBindingChecks.java
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/privacy/AntiRevokeHook.java ]]; then
            test -f qa/test_revoke_sqlite_contract.py
            test -f qa/fixtures/RevokeSqliteBindingChecks.java
          fi

      - name: Require stability tests when their implementations are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/src/main/java/com/waenhancer/update/UpdateTransferPolicy.kt ]]; then
            test -f qa/test_update_download_contract.py
            test -f qa/test_update_session.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/ui/components/RuntimeObservationClock.kt ]]; then
            test -f qa/test_runtime_observation_clock.py
          fi
          if grep -q 'Collections.unmodifiableMap(next)' app/src/main/java/com/waenhancer/xposed/features/customization/FilterItemsHook.kt; then
            test -f qa/test_filter_work.py
          fi
          if grep -q 'release failed:' app/src/main/java/com/waenhancer/xposed/features/media/CallRecordingHook.java; then
            test -f qa/test_recorder_cleanup.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/media/CallRecordingEventContract.java ]]; then
            test -f qa/test_call_recording_lifecycle.py
            test -f qa/fixtures/CallRecordingLifecycleChecks.java
          fi

      - name: Require regression tests for scoped export and identity changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/src/main/java/com/waenhancer/xposed/features/media/GalleryMediaExporter.java ]]; then
            test -f qa/test_gallery_export.py
          fi
          if [[ -f app/src/main/java/com/waenhancer/utils/ContactIdentityPolicy.java ]]; then
            test -f qa/test_contact_identity.py
          fi
          if grep -q 'prefs.contains("hide_forwarded_tag")' app/src/main/java/com/waenhancer/xposed/features/privacy/HideForwardedTagHook.kt; then
            test -f qa/test_forwarded_metadata_scope.py
          fi

      - name: Run remaining required public-source QA suites
        shell: bash
        run: |
          set -euo pipefail
          # These contracts are already present in main. A missing suite must fail
          # this job instead of silently reducing regression coverage.
          for test_script in \
            qa/test_audit_apks.py \
            qa/test_native_alignment.py \
            qa/test_dex_source_anchor_inventory.py \
            qa/test_dex_field_inventory.py \
            qa/test_feature_contract_inventory.py \
            qa/test_preference_type_audit.py \
            qa/test_provider_derived_keys.py \
            qa/test_backup_alias_policy.py \
            qa/test_settings_backup_binary_roundtrip.py \
            qa/test_settings_backup_json.py \
            qa/test_aosp_json_source_fetch.py \
            qa/test_feature_preference_schema_coverage.py \
            qa/test_catalog_schema_alias_contract.py \
            qa/test_slovenian_locale.py \
            qa/test_style_boolean_alias_wiring.py \
            qa/test_style_non_boolean_guard.py \
            qa/test_private_hook_logs.py \
            qa/test_exception_message_privacy.py \
            qa/test_call_privacy_logs.py \
            qa/test_database_dialog_status_log_privacy.py \
            qa/test_blue_receipt_recipient_isolation.py \
            qa/test_manual_blue_tick_ui.py \
            qa/test_manual_seen_tick_persistence.py \
            qa/test_receipt_job_execution_contract.py \
            qa/test_selected_upstream_hardening.py \
            qa/test_played_receipt_dispatch_contract.py \
            qa/test_receipt_observation.py \
            qa/test_presence_event_contract.py \
            qa/test_presence_state_replay.py \
            qa/test_presence_invalidation.py \
            qa/test_presence_state_invalidation.py \
            qa/test_archived_chats_entry.py \
            qa/test_deleted_indicator_bridge.py \
            qa/test_deleted_indicator_preference_types.py \
            qa/test_proximity_event_isolation.py \
            qa/test_proximity_ui_wiring.py \
            qa/test_notification_memory.py \
            qa/test_preserved_own_revoke.py \
            qa/test_status_hook_contract.py \
            qa/test_revoke_sqlite_contract.py \
            qa/test_startup_reconciliation.py \
            qa/test_tasker_policy.py \
            qa/test_separate_groups_policy.py \
            qa/test_declared_targets.py \
            qa/test_runtime_diagnostics.py \
            qa/test_dynamic_menu_resources.py \
            qa/test_update_download_contract.py \
            qa/test_update_session.py \
            qa/test_runtime_observation_clock.py \
            qa/test_filter_work.py \
            qa/test_recorder_cleanup.py \
            qa/test_call_recording_lifecycle.py \
            qa/test_gallery_export.py \
            qa/test_contact_identity.py \
            qa/test_db_migrations.py; do
            echo "::group::$test_script"
            python3 "$test_script"
            echo '::endgroup::'
          done
          # The earlier forwarding implementation was reverted. Keep its suite
          # conditional until it returns; the implementation guard above still
          # requires the fixture when that source contract is present.
          if [[ -f qa/test_forwarded_metadata_scope.py ]]; then
            echo '::group::qa/test_forwarded_metadata_scope.py'
            python3 qa/test_forwarded_metadata_scope.py
            echo '::endgroup::'
          fi

      - name: Scope of verification
        shell: bash
        run: |
          printf '%s\n' \
            'Source QA passed. This is NOT a Gradle/Android build.' \
            'No private :licensing module or proprietary WhatsApp APK was used.' \
            'Hook installation, runtime behavior, signatures and LSPosed compatibility require separate device checks.'

  android-presence-rows:
    name: Extracted renderer / Android framework / native pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Determine whether the reviewed renderer has been merged
        id: presence
        shell: bash
        run: |
          set -euo pipefail
          renderer=app/src/main/java/com/waenhancer/xposed/features/customization/OnlinePresenceIndicatorsHook.kt
          if [[ -f "$renderer" ]] && grep -q 'private fun stateForRow(' "$renderer"; then
            test -f qa/android_presence_row_test.py
            test -f qa/fixtures/PresenceRowRenderingTest.kt
            test -f qa/test_presence_state_replay.py
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::V17 renderer not in this tree; Android presence rendering was NOT tested by this job.'
          fi
      - uses: actions/setup-java@v4
        if: steps.presence.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Run required framework tests for the merged renderer
        if: steps.presence.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/android_presence_row_test.py --out "$RUNNER_TEMP/waex-android-rows"
          echo 'Extracted production renderer passed Android framework/Skia tests. NOT an APK build, WhatsApp binder or LSPosed test.'
      - name: Preserve source identities and text-only rendering evidence
        if: always() && steps.presence.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-presence-row-evidence
          path: |
            ${{ runner.temp }}/waex-android-rows/*.json
            ${{ runner.temp }}/waex-android-rows/*.log
            ${{ runner.temp }}/waex-android-rows/*/*.log
            ${{ runner.temp }}/waex-android-rows/*/*.kt
          retention-days: 14
          if-no-files-found: warn

  runtime-framework:
    name: Runtime policies / Android resource tables / API compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Require tests when runtime evidence code is present
        id: runtime
        run: |
          if [[ -f app/src/main/java/com/waenhancer/utils/InjectionEvidence.kt ]]; then
            test -f qa/verify_runtime_framework.py
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Runtime evidence contribution not merged; its Android probe was NOT executed.'
          fi
      - uses: actions/setup-java@v4
        if: steps.runtime.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile public utilities and observation clock; test compiled version resources
        if: steps.runtime.outputs.present == 'true'
        run: python3 qa/verify_runtime_framework.py --out "$RUNNER_TEMP/waex-runtime-framework"
      - uses: actions/upload-artifact@v4
        if: always() && steps.runtime.outputs.present == 'true'
        with:
          name: runtime-framework-evidence
          path: ${{ runner.temp }}/waex-runtime-framework/evidence
          retention-days: 14
          if-no-files-found: error

  stability-framework:
    name: Stability / real Android Views and Compose runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Select only implementations actually present and require their fixtures
        id: modes
        shell: bash
        run: |
          set -euo pipefail
          modes=""
          if [[ -f app/src/main/java/com/waenhancer/update/UpdateTransferPolicy.kt ]]; then
            modes="$modes update"; test -f qa/fixtures/StabilityUpdateTest.kt
          fi
          if [[ -f app/src/main/java/com/waenhancer/ui/components/RuntimeObservationClock.kt ]]; then
            modes="$modes clock"; test -f qa/fixtures/StabilityClockTest.kt
          fi
          if grep -q 'Collections.unmodifiableMap(next)' app/src/main/java/com/waenhancer/xposed/features/customization/FilterItemsHook.kt; then
            modes="$modes filter"; test -f qa/fixtures/StabilityFilterTest.kt
          fi
          if [[ -n "$modes" ]]; then test -f qa/verify_stability_framework.py; fi
          echo "modes=$modes" >> "$GITHUB_OUTPUT"
          if [[ -z "$modes" ]]; then echo '::notice::Stability production changes absent; no stability framework tests executed.'; fi
      - uses: actions/setup-java@v4
        if: steps.modes.outputs.modes != ''
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute compiled production sources with real framework dependencies
        if: steps.modes.outputs.modes != ''
        shell: bash
        env:
          MODES: ${{ steps.modes.outputs.modes }}
        run: |
          set -euo pipefail
          if [[ "$MODES" == ' update clock filter' ]]; then
            python3 qa/verify_stability_framework.py --out "$RUNNER_TEMP/waex-stability/all"
          else
            for mode in $MODES; do
              python3 qa/verify_stability_framework.py --mode "$mode" --out "$RUNNER_TEMP/waex-stability/$mode"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.modes.outputs.modes != ''
        with:
          name: stability-framework-evidence
          path: ${{ runner.temp }}/waex-stability/*/evidence
          retention-days: 14
          if-no-files-found: error

  call-recording-audio-framework:
    name: Call recording / explicit microphone fallback and source diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require complete recorder and preference regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -version
          mvn -version
          test -f qa/android_call_recording_audio_test.py
          test -f qa/fixtures/CallRecordingAudioAndroidTest.java
          test -f qa/maven_dependencies.py
      - name: Exercise 78 call audio and persistence cases on Android API 24, 28 and 34
        run: python3 qa/android_call_recording_audio_test.py --out "$RUNNER_TEMP/waex-call-recording-audio"
      - name: Preserve source identities, dependency hashes and Android results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-recording-audio-framework-evidence
          path: |
            ${{ runner.temp }}/waex-call-recording-audio/*.json
            ${{ runner.temp }}/waex-call-recording-audio/*.log
          retention-days: 14
          if-no-files-found: error
